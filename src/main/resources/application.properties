spring.application.name=mfa-project

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mfa_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mfa_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mfa_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.thymeleaf.cache=false
server.port=8080
server.address=0.0.0.0