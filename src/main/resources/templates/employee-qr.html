<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kod QR pracownika</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
        }

        img {
            width: 260px;
            height: 260px;
            margin: 20px 0;
        }

        .timer {
            color: #dc2626;
            font-size: 18px;
            font-weight: bold;
        }

        .token {
            font-size: 12px;
            word-break: break-all;
            color: #333;
        }

        a {
            display: block;
            margin-top: 18px;
            padding: 12px;
            background: #16a34a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>System kontroli dostępu</h2>
    <p>Jednorazowy kod QR pracownika</p>

    <img th:src="'data:image/png;base64,' + ${qrBase64}" alt="QR Code">

    <div class="timer">
        Kod wygasa za: <span id="timer">05:00</span>
    </div>

    <p>Pracownik ID: <span th:text="${employeeId}"></span></p>

    <p class="token">
        Token:
        <span th:text="${token}"></span>
    </p>

    <p>
        Ważny do:
        <span th:text="${expiresAt}"></span>
    </p>

    <a th:href="@{'/employee/qr/' + ${employeeId}}">Odśwież kod</a>
</div>

<script>
    let secondsLeft = 300;

    const timerElement = document.getElementById("timer");

    setInterval(() => {
        secondsLeft--;

        const minutes = Math.floor(secondsLeft / 60);
        const seconds = secondsLeft % 60;

        timerElement.textContent =
            String(minutes).padStart(2, "0") + ":" +
            String(seconds).padStart(2, "0");

        if (secondsLeft <= 0) {
            timerElement.textContent = "Kod wygasł";
        }
    }, 1000);
</script>

</body>
</html>
