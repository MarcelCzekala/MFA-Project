<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFA Console Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: #f8f9fa;
        }
        .login-shell {
            min-height: 100vh;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
        }
    </style>
</head>
<body>
<main class="login-shell d-flex align-items-center justify-content-center px-3 py-5">
    <section class="login-card bg-white border rounded shadow-sm p-4">
        <h1 class="h3 mb-4">MFA Console</h1>

        <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
        <div th:if="${param.logout}" class="alert alert-success">Logged out.</div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input id="username" class="form-control" type="text" name="username" autocomplete="username" required autofocus>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input id="password" class="form-control" type="password" name="password" autocomplete="current-password" required>
            </div>

            <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
    </section>
</main>
</body>
</html>
