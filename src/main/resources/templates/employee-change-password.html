<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Zmiana hasła</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
        }

        input, button, a {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            box-sizing: border-box;
            border-radius: 8px;
        }

        input {
            border: 1px solid #cbd5e1;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            display: block;
            background: #64748b;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .error {
            color: #dc2626;
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Zmiana hasła</h2>
    <p>Ustaw nowe hasło do panelu pracownika.</p>

    <form th:action="@{'/employee/change-password/' + ${employeeId}}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="password" name="oldPassword" placeholder="Stare hasło" required>
        <input type="password" name="newPassword" placeholder="Nowe hasło" required>
        <input type="password" name="confirmPassword" placeholder="Powtórz nowe hasło" required>

        <button type="submit">Zmień hasło</button>
    </form>

    <a th:href="@{'/employee/qr/' + ${employeeId}}">Wróć do kodu QR</a>

    <div class="error" th:if="${error}" th:text="${error}"></div>
</div>

</body>
</html>
